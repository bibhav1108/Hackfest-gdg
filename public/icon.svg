<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2334" />
      <stop offset="50%" stop-color="#0a1723" />
      <stop offset="100%" stop-color="#060e17" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with fine border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="4" />

  <!-- Classic Pharmacy Emblem: Mortar & Pestle + Caduceus/Cross Elements -->
  <!-- Outer classic crest circle ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#2dd4bf" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="160" fill="#13273b" fill-opacity="0.7" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="3" />

  <!-- Medical Cross in Center -->
  <g filter="url(#subtleGlow)">
    <!-- Vertical bar -->
    <rect x="226" y="160" width="60" height="192" rx="16" fill="url(#crossGrad)" />
    <!-- Horizontal bar -->
    <rect x="160" y="226" width="192" height="60" rx="16" fill="url(#crossGrad)" />
    <!-- Center core badge -->
    <circle cx="256" cy="256" r="28" fill="#0f2334" stroke="#2dd4bf" stroke-width="4" />
    <circle cx="256" cy="256" r="14" fill="#2dd4bf" />
  </g>

  <!-- Classic Leaf / Botanical Accent -->
  <path d="M256 120 C 275 140, 290 148, 305 145 C 290 162, 275 160, 256 120 Z" fill="#38bdf8" fill-opacity="0.8" />
  <path d="M256 120 C 237 140, 222 148, 207 145 C 222 162, 237 160, 256 120 Z" fill="#38bdf8" fill-opacity="0.8" />
</svg>
